<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sourcify Verification Stats</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <script src="https://cdn.plot.ly/plotly-2.27.0.min.js" charset="utf-8"></script>
  <style>
    /* ── Sourcify brand colors ───────────────────────────────────────────────
       ceruleanBlue-100 #E8EFFF  bg tint / hover
       ceruleanBlue-200 #A9BDEE  borders
       ceruleanBlue-500 #2B50AA  primary active
       ceruleanBlue-800 #0E204E  dark bg / headings
       lightCoral-500   #FF858D  secondary accent
    ─────────────────────────────────────────────────────────────────────── */

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: "IBM Plex Sans", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      background: #f3f4f6; /* gray-100 */
      color: #1f2937;      /* gray-800 */
      min-height: 100vh;
    }

    /* ── Header ─────────────────────────────────────────────────────────── */
    header { background: #0E204E; color: #f8fafc; }
    .header-inner {
      max-width: 1440px; margin: 0 auto;
      padding: 14px 32px;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
    }
    header h1 {
      font-size: 1.1rem; font-weight: 600;
      display: flex; align-items: center; gap: 10px;
    }
    header .meta { font-size: 0.78rem; color: #A9BDEE; white-space: nowrap; }

    /* ── Layout ─────────────────────────────────────────────────────────── */
    .container { max-width: 1440px; margin: 0 auto; padding: 24px 32px; }
    @media (min-width: 768px)  { .container, .header-inner { padding-left: 48px;  padding-right: 48px;  } }
    @media (min-width: 1024px) { .container, .header-inner { padding-left: 96px;  padding-right: 96px;  } }

    /* ── Card base (shared) ─────────────────────────────────────────────── */
    .card {
      background: white;
      border-radius: 12px;
      border: 2px solid transparent;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,.08), 0 2px 4px -1px rgba(0,0,0,.04);
      transition: border-color 300ms, box-shadow 300ms;
    }
    .card:hover {
      border-color: #2B50AA;
      box-shadow: 0 20px 25px -5px rgba(0,0,0,.08), 0 10px 10px -5px rgba(0,0,0,.04);
    }


    /* ── Controls ───────────────────────────────────────────────────────── */
    .controls {
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 16px; flex-wrap: wrap;
    }
    .search-wrap { position: relative; }
    .search-icon {
      position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
      color: #9ca3af; pointer-events: none; display: flex;
    }
    #search {
      height: 40px; padding: 0 14px 0 36px;
      border: 2px solid #A9BDEE;
      border-radius: 6px;
      font-size: 0.85rem; font-family: inherit; outline: none;
      width: 220px; background: #f9fafb;
      transition: border-color .2s, background .2s;
    }
    #search:focus { border-color: #2B50AA; background: white; }

    /* Toggle button groups — pill style matching sourcify-ui buttons */
    .toggle-group { display: flex; gap: 6px; }
    .tog-btn {
      height: 40px; padding: 0 16px;
      border: none; border-radius: 9999px;
      cursor: pointer; white-space: nowrap;
      font-size: 0.82rem; font-weight: 500; font-family: inherit;
      background: #E8EFFF; color: #2B50AA;
      transition: background .15s, color .15s, box-shadow .15s;
    }
    .tog-btn:hover:not(.active) { background: #d0daf7; }
    .tog-btn.active {
      background: #2B50AA; color: white;
      box-shadow: 0 2px 6px rgba(43,80,170,.3);
    }

    /* ── Chart card ─────────────────────────────────────────────────────── */
    .chart-card { margin-bottom: 16px; overflow: hidden; }
    #loading {
      display: flex; align-items: center; justify-content: center;
      height: 300px; color: #9ca3af; font-size: 0.9rem; gap: 10px;
    }
    .spinner {
      width: 18px; height: 18px;
      border: 2px solid #E8EFFF; border-top-color: #2B50AA;
      border-radius: 50%; animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #chart { width: 100%; height: 500px; display: none; }

    /* ── Chains panel ───────────────────────────────────────────────────── */
    .chains-card { padding: 16px 20px; }
    .chains-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 14px; flex-wrap: wrap; gap: 8px;
    }
    .chains-header h3 {
      font-size: 0.75rem; font-weight: 600; color: #6b7280;
      text-transform: uppercase; letter-spacing: .07em;
    }
    .chains-actions { display: flex; gap: 4px; align-items: center; }
    .text-btn {
      font-size: 0.78rem; font-weight: 500; color: #2B50AA;
      background: none; border: none; cursor: pointer;
      padding: 4px 10px; border-radius: 9999px; font-family: inherit;
      transition: background .15s;
    }
    .text-btn:hover { background: #E8EFFF; }
    .hint { font-size: 0.73rem; color: #9ca3af; }

    /* ── Ranked chain table ─────────────────────────────────────────────── */
    .rank-wrap {
      max-height: 620px; overflow-y: auto;
      border: 1px solid #e5e7eb; border-radius: 8px;
    }
    table.rank {
      width: 100%; border-collapse: collapse;
      font-size: 0.85rem; font-variant-numeric: tabular-nums;
    }
    /* Header row and the All Chains row stay at the top when the list scrolls */
    .rank thead { position: sticky; top: 0; z-index: 2; }
    .rank th {
      background: #f9fafb; border-bottom: 1px solid #e5e7eb;
      padding: 9px 12px; text-align: left; white-space: nowrap;
      font-size: 0.7rem; font-weight: 600; color: #6b7280;
      text-transform: uppercase; letter-spacing: .06em;
    }
    .rank th.c-num { text-align: right; cursor: pointer; }
    .rank th.c-num:hover { color: #2B50AA; }
    .rank th.c-num.on { color: #2B50AA; }
    .rank th.c-num.on::after { content: " ▼"; font-size: 0.6rem; }
    .rank td {
      padding: 7px 12px; border-bottom: 1px solid #f3f4f6;
      white-space: nowrap;
    }
    .rank tbody tr { cursor: pointer; transition: background .1s; }
    .rank tbody tr:hover { background: #f5f8ff; }
    .rank tbody tr.on { background: #E8EFFF; }
    .rank tbody tr.on:hover { background: #dce6ff; }
    .rank tbody tr:last-child td { border-bottom: none; }
    .c-sel { width: 36px; padding-right: 0 !important; }
    .c-rank { width: 48px; color: #9ca3af; font-weight: 600; text-align: right; }
    .c-name .nm { font-weight: 500; color: #1f2937; }
    .c-name .cid { color: #9ca3af; font-size: 0.75rem; margin-left: 6px; }
    td.c-num { text-align: right; color: #6b7280; }
    td.c-num.on { color: #0E204E; font-weight: 700; }
    .c-share { width: 22%; min-width: 140px; }
    .share { display: flex; align-items: center; gap: 8px; }
    .share .bar {
      flex: 1; height: 6px; border-radius: 3px; background: #f3f4f6; overflow: hidden;
    }
    .share .bar span { display: block; height: 100%; border-radius: 3px; }
    .share .pct { width: 48px; text-align: right; color: #6b7280; font-size: 0.75rem; }
    .rank-empty { padding: 24px; text-align: center; color: #9ca3af; font-size: 0.85rem; }

    /* All Chains row: dark when shown on the chart, light blue when hidden */
    .all-row { cursor: pointer; }
    .all-row td {
      padding-top: 12px; padding-bottom: 12px; font-size: 0.95rem;
      background: #E8EFFF; color: #0E204E;
      border-bottom: none; box-shadow: inset 0 -2px 0 #A9BDEE;
      transition: background .1s;
    }
    .all-row:hover td { background: #dce6ff; }
    .all-row .nm { font-weight: 700; color: inherit; }
    .all-row .cid { color: #6b7280; }
    .all-row td.c-num { color: #2B50AA; }
    .all-row td.c-num.on { color: #0E204E; font-size: 1.05rem; }
    .all-row .c-rank { color: inherit; font-size: 1.1rem; }
    .all-row .pct { color: inherit; font-weight: 600; }
    .all-row .sel { --c: #2B50AA; }
    .all-row .bar span { background: #2B50AA; }
    .all-row.on td { background: #0E204E; color: white; box-shadow: inset 0 -2px 0 #2B50AA; }
    .all-row.on:hover td { background: #16306f; }
    .all-row.on .cid { color: #A9BDEE; }
    .all-row.on td.c-num { color: #A9BDEE; }
    .all-row.on td.c-num.on { color: white; }
    .all-row.on .sel { --c: white; }
    .all-row.on .sel:checked::after { border-color: #0E204E; }
    .all-row.on .bar { background: rgba(255,255,255,.15); }
    .all-row.on .bar span { background: white; }

    /* Checkbox filled with the chain's line color when shown on the chart */
    .sel {
      appearance: none; -webkit-appearance: none; margin: 0;
      width: 16px; height: 16px; border-radius: 4px; cursor: pointer;
      border: 2px solid var(--c); background: white;
      display: grid; place-content: center; vertical-align: middle;
    }
    .sel:checked { background: var(--c); }
    .sel:checked::after {
      content: ""; width: 4px; height: 8px; margin-top: -2px;
      border: solid white; border-width: 0 2px 2px 0; transform: rotate(45deg);
    }
    .sel:focus-visible { outline: 2px solid #2B50AA; outline-offset: 2px; }

    @media (max-width: 640px) {
      .header-inner { flex-direction: column; align-items: flex-start; gap: 6px; }
      #chart { height: 360px; }
      #search { width: 180px; }
      /* On phones, keep only rank, chain, the selected metric and nothing else */
      .rank td.c-num:not(.on), .rank th.c-num:not(.on), .c-share { display: none; }
      .rank th, .rank td { padding-left: 8px; padding-right: 8px; }
      .c-rank { width: 36px; }
      .c-name .cid { display: block; margin-left: 0; }
    }
  </style>
</head>
<body>

<header>
  <div class="header-inner">
    <h1>
      <img src="https://github.com/sourcifyeth/assets/blob/master/logo-assets-png/sourcify_blue_rounded.png?raw=true"
           alt="Sourcify" height="28" style="border-radius:4px;display:block">
      Verification Stats
    </h1>
    <span class="meta" id="updated">Loading…</span>
  </div>
</header>

<div class="container">


  <div class="controls">
    <div class="search-wrap">
      <span class="search-icon">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
      </span>
      <input id="search" type="text" placeholder="Search chains…" autocomplete="off">
    </div>
    <div class="toggle-group" id="metric-group">
      <button class="tog-btn active" data-mode="total">Total</button>
      <button class="tog-btn" data-mode="full">Full Match</button>
      <button class="tog-btn" data-mode="partial">Partial Match</button>
    </div>
  </div>

  <div class="chart-card card">
    <div id="loading"><div class="spinner"></div>Loading data…</div>
    <div id="chart"></div>
  </div>

  <div class="chains-card card">
    <div class="chains-header">
      <h3>Chains <span id="chain-count" style="font-weight:400;color:#9ca3af"></span></h3>
      <div class="chains-actions">
        <span class="hint">Click a row to show it on the chart</span>
        <button class="text-btn" id="btn-top10">Top 10</button>
        <button class="text-btn" id="btn-clear">Clear all</button>
      </div>
    </div>
    <div class="rank-wrap">
      <table class="rank">
        <thead>
          <tr>
            <th class="c-sel"></th>
            <th class="c-rank">#</th>
            <th class="c-name">Chain</th>
            <th class="c-num" data-mode="total">Total</th>
            <th class="c-num" data-mode="full">Full match</th>
            <th class="c-num" data-mode="partial">Partial match</th>
            <th class="c-share">Share</th>
          </tr>
          <tr id="all-row" class="all-row on"></tr>
        </thead>
        <tbody id="rank-body"></tbody>
      </table>
    </div>
  </div>

</div>

<script>
// ─── Plotly default colorway ───────────────────────────────────────────────
const COLORS = [
  '#636EFA','#EF553B','#00CC96','#AB63FA','#FFA15A',
  '#19D3F3','#FF6692','#B6E880','#FF97FF','#FECB52',
  '#1F77B4','#FF7F0E','#2CA02C','#D62728','#9467BD',
  '#8C564B','#E377C2','#7F7F7F','#BCBD22','#17BECF',
  '#AEC7E8','#FFBB78','#98DF8A','#FF9896','#C5B0D5',
  '#C49C94','#F7B6D2','#C7C7C7','#DBDB8D','#9EDAE5',
];

// ─── State ─────────────────────────────────────────────────────────────────
let appData   = null;
let sorted    = [];
let active    = new Set();
let mode          = 'total';
let showAllChains = true;
let plotReady     = false;

// ─── Helpers ───────────────────────────────────────────────────────────────

function getY(chain) {
  if (mode === 'full')    return chain.full;
  if (mode === 'partial') return chain.partial;
  return chain.total;
}

// ─── Aggregate "All Chains" line ───────────────────────────────────────────
function computeAggregate() {
  const map = new Map();
  for (const { chain } of sorted) {
    const vals = getY(chain);
    chain.dates.forEach((d, i) => {
      map.set(d, (map.get(d) || 0) + vals[i]);
    });
  }
  const dates = Array.from(map.keys()).sort();
  return { dates, vals: dates.map(d => map.get(d)) };
}

// ─── Build all Plotly traces ───────────────────────────────────────────────
function buildTraces() {
  const agg = computeAggregate();
  const traces = [{
    x: agg.dates,
    y: agg.vals,
    name: 'All Chains',
    type: 'scatter',
    mode: 'lines',
    visible: true,
    visible: showAllChains,
    line: { color: '#2B50AA', width: 2.5 },
    hovertemplate: '<b>All Chains</b><br>%{x|%b %d, %Y}: <b>%{y:,}</b><extra></extra>',
  }];
  for (const { id, chain, color } of sorted) {
    const label = chain.name.includes(id) ? chain.name : `${chain.name} (${id})`;
    traces.push({
      x: chain.dates,
      y: getY(chain),
      name: label,
      type: 'scatter',
      mode: 'lines',
      visible: active.has(id) ? true : false,
      line: { color, width: 1.5 },
      hovertemplate: '<b>%{fullData.name}</b><br>%{x|%b %d, %Y}: <b>%{y:,}</b><extra></extra>',
    });
  }
  return traces;
}

// ─── Chart ─────────────────────────────────────────────────────────────────
function renderChart() {
  document.getElementById('loading').style.display = 'none';
  const chartEl = document.getElementById('chart');
  chartEl.style.display = 'block';

  const traces = buildTraces();
  const layout = {
    margin: { t: 20, r: 16, b: 50, l: 70 },
    hovermode: 'closest',
    showlegend: false,
    xaxis: {
      type: 'date',
      gridcolor: '#f3f4f6',
      rangeslider: { visible: true, thickness: 0.04, bgcolor: '#f9fafb' },
      rangeselector: {
        y: 1.02,
        buttons: [
          { count: 1,  label: '1M', step: 'month', stepmode: 'backward' },
          { count: 3,  label: '3M', step: 'month', stepmode: 'backward' },
          { count: 6,  label: '6M', step: 'month', stepmode: 'backward' },
          { count: 1,  label: '1Y', step: 'year',  stepmode: 'backward' },
          { step: 'all', label: 'All' },
        ],
        bgcolor: '#f9fafb',
        bordercolor: '#A9BDEE',
        borderwidth: 1,
        activecolor: '#2B50AA',
        font: { size: 11 },
      },
    },
    yaxis: {
      tickformat: ',d',
      gridcolor: '#f3f4f6',
      zeroline: false,
    },
    paper_bgcolor: 'white',
    plot_bgcolor: 'white',
    font: { family: '"IBM Plex Sans", Roboto, sans-serif', size: 12, color: '#1f2937' },
  };

  if (!plotReady) {
    Plotly.newPlot('chart', traces, layout, {
      responsive: true,
      displaylogo: false,
      modeBarButtonsToRemove: ['select2d', 'lasso2d', 'toImage'],
    });
    plotReady = true;
  } else {
    Plotly.react('chart', traces, layout);
  }
}

// ─── Ranked chain table ────────────────────────────────────────────────────
const num = n => n.toLocaleString('en-US');
const esc = s => String(s).replace(/[&<>"']/g, ch =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));

function latestOf(c) {
  if (mode === 'full')    return c.latestFull;
  if (mode === 'partial') return c.latestPartial;
  return c.latestTotal;
}

// Chains ordered by the selected metric. Ties keep the order by total.
function ranked() {
  return [...sorted].sort((a, b) => latestOf(b) - latestOf(a));
}

function renderList() {
  const filter = document.getElementById('search').value.toLowerCase().trim();
  const list = ranked();
  const top = latestOf(list[0]) || 1;
  const sum = list.reduce((s, c) => s + latestOf(c), 0) || 1;

  document.querySelectorAll('.rank th.c-num').forEach(th =>
    th.classList.toggle('on', th.dataset.mode === mode));

  let visible = 0;
  const rows = list.map((c, i) => {
    const { id, chain, color } = c;
    const match = !filter
      || chain.name.toLowerCase().includes(filter)
      || id.includes(filter);
    if (!match) return '';
    visible++;
    const on = active.has(id);
    const v = latestOf(c);
    const cell = (m, val) => `<td class="c-num${mode === m ? ' on' : ''}">${num(val)}</td>`;
    return `<tr data-id="${id}" class="${on ? 'on' : ''}">
      <td class="c-sel"><input type="checkbox" class="sel" style="--c:${color}"
        aria-label="Show ${esc(chain.name)} on chart"${on ? ' checked' : ''}></td>
      <td class="c-rank">${i + 1}</td>
      <td class="c-name"><span class="nm">${esc(chain.name)}</span><span class="cid">Chain ID: ${id}</span></td>
      ${cell('total', c.latestTotal)}${cell('full', c.latestFull)}${cell('partial', c.latestPartial)}
      <td class="c-share"><div class="share">
        <div class="bar"><span style="width:${(v / top * 100).toFixed(1)}%;background:${color}"></span></div>
        <span class="pct">${(v / sum * 100).toFixed(v / sum >= 0.1 ? 1 : 2)}%</span>
      </div></td>
    </tr>`;
  }).join('');

  renderAllRow();
  document.getElementById('rank-body').innerHTML = rows
    || `<tr><td colspan="7" class="rank-empty">No chains match “${esc(filter)}”</td></tr>`;
  document.getElementById('chain-count').textContent = `(${visible} shown)`;
}

// The pinned All Chains row at the top of the table: sums over every chain.
function renderAllRow() {
  const sum = key => sorted.reduce((s, c) => s + c[key], 0);
  const cell = (m, val) => `<td class="c-num${mode === m ? ' on' : ''}">${num(val)}</td>`;
  const tr = document.getElementById('all-row');
  tr.classList.toggle('on', showAllChains);
  tr.innerHTML = `
    <td class="c-sel"><input type="checkbox" class="sel"
      aria-label="Show All Chains on chart"${showAllChains ? ' checked' : ''}></td>
    <td class="c-rank">Σ</td>
    <td class="c-name"><span class="nm">All Chains</span><span class="cid">Total: ${sorted.length} chains</span></td>
    ${cell('total', sum('latestTotal'))}${cell('full', sum('latestFull'))}${cell('partial', sum('latestPartial'))}
    <td class="c-share"><div class="share">
      <div class="bar"><span style="width:100%"></span></div><span class="pct">100%</span>
    </div></td>`;
}

// Update one row in place, so the checkbox keeps keyboard focus.
function updateRow(id) {
  const tr = document.querySelector(`#rank-body tr[data-id="${id}"]`);
  if (!tr) return;
  const on = active.has(id);
  tr.classList.toggle('on', on);
  tr.querySelector('.sel').checked = on;
}

// ─── Toggle a single chain ─────────────────────────────────────────────────
function toggleChain(id) {
  if (active.has(id)) active.delete(id); else active.add(id);
  const idx = sorted.findIndex(c => c.id === id);
  if (idx >= 0 && plotReady) {
    Plotly.restyle('chart', { visible: active.has(id) ? true : false }, [idx + 1]);
  }
  updateRow(id);
}

function setMode(m) {
  if (m === mode) return;
  mode = m;
  document.querySelectorAll('#metric-group .tog-btn').forEach(b =>
    b.classList.toggle('active', b.dataset.mode === mode));
  renderChart();
  renderList();
}

// ─── Init ──────────────────────────────────────────────────────────────────
async function init() {
  const res = await fetch('./data.json');
  if (!res.ok) throw new Error(`Failed to load data.json: ${res.status}`);
  appData = await res.json();

  sorted = Object.entries(appData.chains)
    .map(([id, chain]) => ({
      id, chain,
      latestTotal:   chain.total.at(-1)   || 0,
      latestFull:    chain.full.at(-1)    || 0,
      latestPartial: chain.partial.at(-1) || 0,
    }))
    .sort((a, b) => b.latestTotal - a.latestTotal)
    .map((item, i) => ({ ...item, color: COLORS[i % COLORS.length] }));

  sorted.slice(0, 10).forEach(c => active.add(c.id));
  document.getElementById('updated').textContent = 'Updated ' + appData.lastUpdated;

  renderChart();
  renderList();
}

// ─── Event listeners ───────────────────────────────────────────────────────

// Metric toggle (Total / Full Match / Partial Match), from buttons or table headers
document.querySelectorAll('#metric-group .tog-btn, .rank th.c-num').forEach(el => {
  el.addEventListener('click', () => setMode(el.dataset.mode));
});

// Click anywhere on a row (or its checkbox) to show or hide that chain
document.getElementById('rank-body').addEventListener('click', e => {
  const tr = e.target.closest('tr[data-id]');
  if (tr) toggleChain(tr.dataset.id);
});

// All Chains toggle
document.getElementById('all-row').addEventListener('click', () => {
  showAllChains = !showAllChains;
  const tr = document.getElementById('all-row');
  tr.classList.toggle('on', showAllChains);
  tr.querySelector('.sel').checked = showAllChains;
  if (plotReady) Plotly.restyle('chart', { visible: showAllChains }, [0]);
});

document.getElementById('search').addEventListener('input', renderList);

// Top 10 follows the ranking of the selected metric
document.getElementById('btn-top10').addEventListener('click', () => {
  active.clear();
  ranked().slice(0, 10).forEach(c => active.add(c.id));
  renderChart();
  renderList();
});

document.getElementById('btn-clear').addEventListener('click', () => {
  active.clear();
  renderChart();
  renderList();
});

init().catch(err => {
  document.getElementById('loading').innerHTML =
    `<span style="color:#ef4444">Error loading data: ${err.message}</span>`;
});
</script>

</body>
</html>
